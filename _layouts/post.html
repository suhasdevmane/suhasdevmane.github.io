<!DOCTYPE HTML>
<html lang="en" >
    <head>

        {%- include head.html -%}

        {% if page.previous %}
            <link rel="prev" href="{{site.baseurl}}{{page.previous.url}}" />
        {% endif %}

        {% if page.next %}
            <link rel="next" href="{{site.baseurl}}{{page.next.url}}" />
        {% endif %}
    </head>
    <body class="os-docs">
        <div class="book">

            {%- include toc-date.html -%}

            <div class="book-body">
                <div class="book-header" role="navigation">
                    <!-- Title (GitBook shows it on narrow screens) -->
                    <h1>
                        <i class="fa fa-circle-o-notch fa-spin"></i>
                        <a href="{{ site.baseurl }}{{ page.url }}">{{ page.title | default: site.title | escape }}</a>
                    </h1>
                    <div class="os-topbar">
                        <a class="os-topbar-brand" href="{{ site.baseurl }}/"><span class="os-logo" aria-hidden="true">◆</span>OntoSage</a>
                        <nav class="os-topbar-links" aria-label="Site">
                            <a href="{{ site.baseurl }}/docs/"{% if page.url == "/docs/" %} aria-current="page"{% endif %}>Docs</a>
                            <a href="{{ site.baseurl }}/docs/quickstart/">Quick start</a>
                            <a href="{{ site.baseurl }}/explorer/">Ontology Explorer</a>
                            <a class="os-topbar-gh" href="https://github.com/suhasdevmane/OntoSage" rel="noopener" aria-label="OntoSage on GitHub"><i class="fa fa-github" aria-hidden="true"></i><span>GitHub</span></a>
                        </nav>
                    </div>
                </div>

                <div class="body-inner">
                    {%- include body.html -%}
                </div>
            </div>

            <script>
            var gitbook = gitbook || [];
            gitbook.push(function() {
                gitbook.page.hasChanged({%- include metadata-post.json.tpl -%});
            });
            </script>
        </div>

        {%- include footer.html -%}

    </body>
</html>
